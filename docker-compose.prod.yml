# Sobrescribe el compose base para producción: imágenes `prod`, sin puertos de BD/API expuestos.
# Requiere un .env real (ver .env.example) con secretos propios.
services:
  db:
    ports: !reset []
  api:
    build:
      target: prod
    environment:
      ENVIRONMENT: production
      STORAGE_DIR: /data/storage
    ports: !reset []
    # Sin el bind-mount del código (dev); solo el volumen de adjuntos clínicos.
    volumes: !override
      - attachments_data:/data/storage
    restart: unless-stopped
  web:
    build:
      target: prod
    environment: !reset {}
    ports:
      - "80:80"
    volumes: !reset []
    restart: unless-stopped

volumes:
  attachments_data:
