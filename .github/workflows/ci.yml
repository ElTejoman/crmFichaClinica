name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: clinic, POSTGRES_PASSWORD: clinic_dev, POSTGRES_DB: clinic_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://clinic:clinic_dev@localhost:5432/clinic_test
      DATABASE_URL: postgresql+asyncpg://clinic:clinic_dev@localhost:5432/clinic_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: alembic upgrade head # verifica que las migraciones aplican sobre BD vacía
      - run: pytest -q
      - name: Contrato OpenAPI sin cambios pendientes
        run: |
          python scripts/export_openapi.py /tmp/openapi.json
          diff -q /tmp/openapi.json ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/shared/types/api.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
