# Entorno de DESARROLLO local (Docker Desktop):  docker compose up --build
#   Web:  http://localhost:5173      API: http://localhost:8000/docs      BD: localhost:5432
# Producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: clinic-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_dev}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      TZ: UTC # la BD guarda todo en UTC (ADR-008)
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic_dev}@db:5432/${POSTGRES_DB:-clinic}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv # recarga en caliente

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules # evita pisar node_modules del contenedor

volumes:
  db_data:
  web_node_modules:
